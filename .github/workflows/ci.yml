name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.5
          cache: npm
      - name: Install system tooling
        run: sudo apt-get update && sudo apt-get install --yes gnome-shell jq shellcheck unzip
      - name: Install pinned development dependencies
        run: npm ci
      - name: Validate source
        run: make check
      - name: Build and validate release artifacts
        run: make release-artifacts
      - name: Upload extension bundle
        uses: actions/upload-artifact@v4
        with:
          name: login-hud-${{ github.sha }}
          path: |
            dist/*.shell-extension.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14
