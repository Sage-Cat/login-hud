name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.19.5
          cache: npm
      - name: Install system tooling
        run: sudo apt-get update && sudo apt-get install --yes gnome-shell jq shellcheck unzip
      - name: Install pinned development dependencies
        run: npm ci
      - name: Validate source
        run: make check
      - name: Build and validate release artifacts
        run: make release-artifacts
      - name: Upload extension bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: login-hud-${{ github.sha }}
          path: |
            dist/*.shell-extension.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14
